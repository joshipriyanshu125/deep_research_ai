[pytest]
pythonpath = .
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:anyio.*
    ignore::starlette.testclient.StarletteDeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
    ignore:This package.*duckduckgo_search.*renamed:RuntimeWarning
    ignore:.*duckduckgo_search.*:RuntimeWarning
    ignore:.*renamed to.*ddgs.*:RuntimeWarning
